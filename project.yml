name: Playtation
options:
  bundleIdPrefix: com.playtation
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MARKETING_VERSION: "1.3"
  CURRENT_PROJECT_VERSION: "33"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  ENABLE_APP_SANDBOX: NO
  ENABLE_HARDENED_RUNTIME: NO
targets:
  PlaytationController:
    type: application
    platform: macOS
    sources:
      - path: ControllerAgent
      - path: Playtation/Input/DualSenseHID.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.playtation.PlaytationController
      PRODUCT_NAME: PlaytationController
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSUIElement: YES
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      SKIP_INSTALL: YES
  Playtation:
    type: application
    platform: macOS
    sources:
      - path: Playtation
        excludes:
          - Resources/Info.plist
          - Resources/AppIcon.icon
    dependencies:
      - target: PlaytationController
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.playtation.Playtation
      PRODUCT_NAME: Playtation
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Playtation/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
    scheme:
      gatherCoverageData: false
      testTargets:
        - PlaytationTests
  PlaytationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PlaytationTests
      - path: Playtation/Metadata/TitleMatcher.swift
      - path: Playtation/Input/PatternTrace.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.playtation.PlaytationTests
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
